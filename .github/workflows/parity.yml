name: vanilla parity
# Called only by the daily on the main head it started on. Harness output and vanilla data stay on the runner.
on:
  workflow_call:
    inputs:
      commit:
        description: The commit to test
        type: string
        required: true
defaults:
  run:
    shell: bash
permissions:
  contents: read
env:
  SUNRISE_TELEMETRY_URL: "off"
jobs:
  vanilla-parity:
    runs-on: dyna-large
    # Run four harnesses at a time; a Dyna runner ends at 6 h.
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - name: Start a fresh private log directory for this attempt
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          root="${DYNA_CI_BUILD:?}/parity-keep"
          mkdir -p "$root"
          dir="$root/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf -- "$dir"
          mkdir "$dir"
          printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$COMMIT" > "$dir/scope"
          echo "PARITY_LOG_DIR=$dir" >> "$GITHUB_ENV"
          find "$root" -mindepth 1 -maxdepth 1 -type d -mmin +4320 -exec rm -rf {} +
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Check Dyna dependencies (install fallback without root)
        run: bash tools/ci/dyna_ci_deps.sh
      - name: Install Rust toolchain
        run: |
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          fi
          bash tools/ci/rustup_install.sh --profile minimal
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      # Every job that builds in this runner's persistent target keeps its source snapshot true: a
      # build of another tree without it left artifacts that a later job judged fresh (stale generated
      # sources, 2026-11-13). Only byte-identical Git objects regain their previous timestamps.
      - name: Restore unchanged source timestamps
        run: python3 tools/ci/source_mtimes.py "${CARGO_TARGET_DIR:-target}/ci-source-mtimes-v2.json"
      # Every build and test in this job runs at the runner's size, not the host's (tools/ci/cargo_jobs.py).
      - name: Cap build parallelism to the runner
        run: python3 tools/ci/cargo_jobs.py --job-mib 3072 --cap
      - name: Set up disk-backed parity scratch and prepared vanilla data
        run: |
          rm -rf "$DYNA_CI_BUILD/parity-out" "$DYNA_CI_BUILD/parity-tmp"
          mkdir -p "$DYNA_CI_BUILD/parity-out" "$DYNA_CI_BUILD/parity-tmp"
          ln -s "$DYNA_CI_BUILD/parity-out" .local
          # The probes' build folder (tools/parity.py's .local/parity-target) lives under the slot's persistent target,
          # so a run rebuilds only what changed instead of the whole game from cold (a harness's own 900 s build limit
          # ran out on that, 2026-11-16). The source snapshot step above keeps it true across trees.
          mkdir -p "$CARGO_TARGET_DIR/parity"
          ln -s "$CARGO_TARGET_DIR/parity" .local/parity-target
          echo "TMPDIR=$DYNA_CI_BUILD/parity-tmp" >> "$GITHUB_ENV"
          # tools/parity.py keeps pass records beside .local/minecraft, which is the read-only cache and holds
          # other trees' passes: this run's records start empty, on the slot.
          echo "PARITY_SHARED=$DYNA_CI_BUILD/parity-out/shared" >> "$GITHUB_ENV"
          SUNRISE_DYNA_CACHE=true SUNRISE_PREPARED_CACHE="$DYNA_CI_BUILD/vanilla" SUNRISE_SHARED_SOURCE=/cache/sunrise-local \
            bash tools/ci/vanilla-data.sh > "$PARITY_LOG_DIR/setup.log" 2>&1
      # The game opens a window even with --offscreen, and the runner has no display: a virtual X display for every
      # harness, started from this workflow and left running for the job.
      - name: Virtual display
        run: |
          Xvfb -displayfd 3 -screen 0 1280x1024x24 -nolisten tcp 3> "$RUNNER_TEMP/xvfb-display" > /dev/null 2>&1 &
          for _ in $(seq 60); do [ -s "$RUNNER_TEMP/xvfb-display" ] && break; sleep 0.5; done
          [ -s "$RUNNER_TEMP/xvfb-display" ] || { echo "::error::Xvfb did not report a display within 30 seconds"; exit 1; }
          echo "DISPLAY=:$(tr -d '[:space:]' < "$RUNNER_TEMP/xvfb-display")" | tee -a "$GITHUB_ENV"
          echo "WAYLAND_DISPLAY=" >> "$GITHUB_ENV"
      # Prebuild the probes under their time limits and compile the largest test binaries separately to fit memory.
      - name: Build the daily harnesses' game probes
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_INCREMENTAL: 'true'
          CARGO_PROFILE_DEV_OPT_LEVEL: '3'
        run: |
          export CARGO_TARGET_DIR="$PWD/.local/parity-target"
          exec > "$PARITY_LOG_DIR/game-probes.log" 2>&1
          scripts=(tools/test_*_parity.py)
          if grep -q "'--example', 'client_probe'" "${scripts[@]}"; then
            cargo build --profile fast -p sunrise-client-lib --example client_probe
          fi
          if grep -q "'sunrise-game', '-p', 'sunrise-client-lib', '--bins'" "${scripts[@]}"; then
            cargo build --locked --profile fast -p sunrise-game -p sunrise-client-lib --bins
          fi
          if grep -Eq "[\"']sunrise-game[\"'], [\"']--bin[\"'], [\"']sunrise-client[\"']" "${scripts[@]}"; then
            cargo build --profile fast -p sunrise-game --bin sunrise-client
          fi
          # The client lib tests harnesses run (`cargo test -p <package> --lib`, the dev profile as parity.py sets it),
          # one at a time and before any oracle starts: one rustc of up to 12 GiB each, which a 16 GiB runner
          # killed beside the harnesses (signal 9: mount_control and damage_catalog on main, 2026-11-16).
          for package in sunrise-client-lib sunrise-client; do
            if grep -Eq "[\"']test[\"'], ([\"']--locked[\"'], )?[\"']-p[\"'], [\"']$package[\"'], [\"']--lib[\"']" "${scripts[@]}"; then
              cargo test --locked --no-run -p "$package" --lib
            fi
          done
      - name: Build parity probes
        run: |
          exec > "$PARITY_LOG_DIR/probes.log" 2>&1
          cargo build --release --bin sunrise-parity
          cargo build --release --bin sunrise-tick-parity
          cargo build --release --bin sunrise-geometry-parity
          cargo build --release --bin sunrise-noise-parity
          cargo build --release --bin sunrise-density-parity
          cargo build --release --bin sunrise-worldgen-parity
          cargo build --release --bin sunrise-float-log-parity
          cargo build --release -p sunrise-core --example generation_tick_fixture
          cargo build --release -p sunrise-core --example biome_zoom_fixture
          cargo build --release -p sunrise-world --bin sunrise-world --example world_probe
          cargo build --release -p sunrise-world --example world_probe
      - name: Run every automatic harness
        env:
          PARITY_HOSTS: ''
        run: |
          # The runner writes retry reasons to the step summary as well as stdout; keep both private.
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/parity-private-summary"
          log="$PARITY_LOG_DIR/parity.log"
          status=0
          python3 tools/parity.py --all --skip-named-only -j 4 --timeout 2400 \
            --selection-file "$PARITY_LOG_DIR/selection.json" \
            > "$log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$PARITY_LOG_DIR/exit"
          echo "Parity exited $status"
          exit "$status"
      # Only names and outcomes go to the daily summary. Keep setup and harness logs on the runner slot.
      - name: Write the harnesses' verdict
        if: always()
        run: |
          [ -n "${PARITY_LOG_DIR:-}" ] || exit 0  # setup did not initialise this attempt
          python3 tools/ci/parity_verdict.py "$PARITY_LOG_DIR" "$RUNNER_TEMP/parity.json"
      - name: Upload the harnesses' verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-parity-${{ github.run_attempt }}
          path: ${{ runner.temp }}/parity.json
          if-no-files-found: ignore
          retention-days: 7
