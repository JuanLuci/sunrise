ids = ["type:EntityWrite", "type:InsideEffect", "type:InsideEffects", "type:PlannedInside"]
why = "A built wasm mod now names each item of the game it uses, so a game build refuses it only when an item it uses changed, not on any API change. This is the one break: every wasm mod built before it is refused once. EntityWrite and InsideEffects also change their bytes: their three-number vectors and five-case arrays are written by the derive, as fixed-size arrays with no length prefix, where the hand-written codec wrote lists."
migrate = "A built mod imports every host call (a hook hands it `&mut dyn ServerHost`, whose vtable keeps them all), so changing or removing any host call refuses every built mod, while a new method refuses none. Rebuild the mod against this SDK: the rebuild moves its numbered imports to names, and a mod that uses the derive changes nothing in its source. A mod that decodes an EntityWrite or an InsideEffects by hand needs a source change to match the derive's form."
